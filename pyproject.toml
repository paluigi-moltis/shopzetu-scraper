[project]
name = "shopzetu-scraper"
version = "0.1.0"
description = "Python scraper for shopzetu.com — fetches product data via the hidden Shopify Hydrogen JSON API and stores in MongoDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Luigi Palumbo" }]
dependencies = [
    "httpx>=0.27",
    "pymongo>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
shopzetu-scraper = "shopzetu_scraper.scraper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shopzetu_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
